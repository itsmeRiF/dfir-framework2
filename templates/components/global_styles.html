{# Shared look for the analysis pages.

   Wrap a page in .cx-page to pick these up. A page sets its own header
   gradient with --hero-1..4 and its own accent with --accent; every
   other colour here is shared, so a case keeps one colour and a
   severity one badge everywhere in the product. #}

<style>

/* ================= tokens =================

   .viz-root is the older name for the same wrapper; both are
   accepted so pages can be converted one at a time. */

.cx-page,
.viz-root{

    --surface:#ffffff;
    --plane:#f7f8fa;

    --ink:#111827;
    --text-secondary:#52514e;
    --muted:#6b7280;

    --grid:#e1e0d9;
    --line:rgba(16,32,64,.09);

    --shadow:0 4px 16px rgba(16,32,64,.07);
    --shadow-lg:0 16px 38px rgba(16,32,64,.16);

    /* Page accent, overridden per page. */
    --accent:#0d6efd;

    /* Header gradient, overridden per page. */
    --hero-1:#1e1b4b;
    --hero-2:#3730a3;
    --hero-3:#4f46e5;
    --hero-4:#38bdf8;
    --hero-glow:79,70,229;

    /* categorical slots */
    --tone-1:#2a78d6;
    --tone-2:#12a150;
    --tone-3:#7c3aed;
    --tone-4:#0d9488;
    --tone-5:#0ea5e9;
    --tone-6:#e8590c;
    --tone-7:#db2777;
    --tone-8:#dc3545;

}


/* ================= hero ================= */

.cx-hero{

    position:relative;
    overflow:hidden;
    border-radius:20px;
    padding:26px 30px;
    color:#fff;
    background:linear-gradient(120deg,
               var(--hero-1) 0%,
               var(--hero-2) 38%,
               var(--hero-3) 72%,
               var(--hero-4) 100%);
    box-shadow:0 14px 34px rgba(var(--hero-glow),.30);

}

/* Slow drifting glow, so the header has depth without an image. */

.cx-hero::after{

    content:"";
    position:absolute;
    top:-70%;
    right:-6%;
    width:400px;
    height:400px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.20),transparent 65%);
    animation:cx-drift 10s ease-in-out infinite alternate;
    pointer-events:none;

}

@keyframes cx-drift{

    from{ transform:translate(0,0); }
    to{   transform:translate(-38px,26px); }

}

.cx-hero h2,
.cx-hero p,
.cx-hero-actions,
.cx-hero-meta{

    position:relative;
    z-index:2;

}

.cx-hero h2{ font-weight:700; }

.cx-hero p{ opacity:.92; margin:0; }

/* Facts carried in the header itself, e.g. a case's investigator. */

.cx-hero-meta{

    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;

}

.cx-hero-meta span{

    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 11px;
    border-radius:999px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.22);
    font-size:12px;
    font-weight:600;

}


/* ================= KPI tiles ================= */

.cx-tile{

    position:relative;
    display:block;
    width:100%;
    height:100%;
    text-align:left;
    padding:14px 16px;
    border-radius:14px;
    background:linear-gradient(180deg,
               color-mix(in srgb, var(--tone,var(--accent)) 13%, #fff) 0%,
               #fff 62%);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease;

}

.cx-tile::after{

    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:var(--tone,var(--accent));

}

.cx-tile.tone-1{ --tone:var(--tone-1); }
.cx-tile.tone-2{ --tone:var(--tone-2); }
.cx-tile.tone-3{ --tone:var(--tone-3); }
.cx-tile.tone-4{ --tone:var(--tone-4); }
.cx-tile.tone-5{ --tone:var(--tone-5); }
.cx-tile.tone-6{ --tone:var(--tone-6); }
.cx-tile.tone-7{ --tone:var(--tone-7); }
.cx-tile.tone-8{ --tone:var(--tone-8); }

.cx-tile-icon{

    font-size:15px;
    color:var(--tone,var(--accent));
    margin-bottom:4px;

}

.cx-tile-value{

    font-size:24px;
    font-weight:800;
    line-height:1.1;
    color:var(--tone,var(--accent));
    font-variant-numeric:tabular-nums;

}

.cx-tile-label{

    font-size:11px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--text-secondary);

}

/* A tile that navigates or filters. */

.cx-tile.is-link,
.cx-tile.is-filter{ cursor:pointer; }

.cx-tile.is-link:hover,
.cx-tile.is-filter:hover{

    transform:translateY(-3px);
    box-shadow:var(--shadow-lg);
    color:inherit;

}

.cx-tile.is-filter.on{

    border-color:var(--tone,var(--accent));
    box-shadow:0 0 0 1px var(--tone,var(--accent)) inset,
               0 10px 24px -12px var(--tone,var(--accent));

}

.cx-tile-go{

    position:absolute;
    right:12px;
    bottom:12px;
    font-size:13px;
    color:var(--tone,var(--accent));
    opacity:0;
    transform:translateX(-4px);
    transition:.2s;

}

.cx-tile.is-link:hover .cx-tile-go{

    opacity:1;
    transform:translateX(0);

}


/* ================= cards ================= */

.cx-card{

    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 20px 20px;
    box-shadow:var(--shadow);

}

.cx-card-head{

    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;

}

.cx-card-head h6{

    margin:0;
    font-weight:700;
    color:var(--ink);

}

.cx-card-head small{ color:var(--muted); }

.cx-head-badge{

    background:color-mix(in srgb, var(--accent) 12%, #fff);
    color:var(--accent);
    font-size:12px;
    font-weight:700;
    padding:5px 12px;
    border-radius:999px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;

}

.cx-card-total{

    margin-top:12px;
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;

}

.cx-card-total small{

    font-size:11px;
    font-weight:600;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--muted);

}

.cx-canvas{ position:relative; }

.cx-chip-stats{ display:flex; gap:8px; flex:none; }

.cx-chip-stats span{

    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 10px;
    border-radius:999px;
    background:#eef2f7;
    color:#42505f;
    font-size:12px;
    font-weight:700;
    font-variant-numeric:tabular-nums;

}


/* ================= toolbar / filters ================= */

.cx-toolbar{

    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    box-shadow:var(--shadow);

}

.cx-page .form-control,
.cx-page .form-select{ border-color:#e3e8ef; }

.cx-page .form-control:focus,
.cx-page .form-select:focus{

    border-color:var(--accent);
    box-shadow:0 0 0 .15rem color-mix(in srgb, var(--accent) 22%, transparent);

}

.cx-count{

    font-variant-numeric:tabular-nums;
    white-space:nowrap;

}


/* ================= tables ================= */

.cx-table th{

    font-size:12px;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
    white-space:nowrap;
    background:#f7f9fc;
    border-bottom:1px solid rgba(16,32,64,.08);

}

.cx-table td{ vertical-align:middle; }

.cx-table td.num,
.cx-table .num{ font-variant-numeric:tabular-nums; }

.cx-table code{ font-size:.85rem; }

.cx-table .badge{ padding:.5em .8em; }

.cx-table form{ display:inline; margin:0; }

.cx-table tfoot td{ border-top:2px solid var(--grid); }

.cx-table tbody tr{ transition:background .15s ease; }

.cx-table tbody tr[data-row]:hover{

    background:color-mix(in srgb, var(--case, var(--accent)) 6%, #fff);

}

/* Left edge coloured by whatever the row belongs to. */

.cx-table tbody tr[data-row] td:first-child{

    box-shadow:inset 3px 0 0 var(--case,transparent);

}

/* Sortable headers announce themselves with a chevron that fills in
   once the column is the one being sorted. */

.cx-table th.sortable{ cursor:pointer; user-select:none; }

.cx-table th.sortable:hover{ color:var(--accent); }

.cx-table th .sort-icon{

    opacity:.25;
    margin-left:3px;
    font-size:11px;

}

.cx-table th.sorted,
.cx-table th.sorted .sort-icon{

    opacity:1;
    color:var(--accent);

}

/* Long free text stays on one line rather than pushing the table
   sideways; the full value is in the title attribute. */

.cx-clip{

    display:block;
    max-width:420px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

}

.cx-scroll{ max-height:620px; overflow:auto; }

.cx-scroll thead th{ position:sticky; top:0; z-index:2; }


/* ================= case chip ================= */

.cx-swatch{

    width:10px;
    height:10px;
    border-radius:3px;
    flex:none;
    display:inline-block;
    background:var(--case,var(--accent));

}

.cx-case{

    color:inherit;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:8px;

}

.cx-case:hover .fw-semibold{ color:var(--accent); }


/* ================= pills ================= */

/* .cx-sev is the older name for a severity pill; both are accepted
   so pages can be converted one at a time. */

.cx-pill,
.cx-sev{

    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:.3em .65em;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.3px;
    text-transform:uppercase;
    white-space:nowrap;
    border:1px solid transparent;

}

/* The older markup wrote the level as a bare class: .cx-sev.high */

.cx-sev.critical{ background:#fde7e9; color:#b02a37; border-color:#f5c2c7; }
.cx-sev.high{     background:#fff0e2; color:#a2540b; border-color:#fdd9b5; }
.cx-sev.medium{   background:#fff6d9; color:#8a6100; border-color:#ffe69c; }
.cx-sev.low{      background:#dff7fd; color:#0a7c92; border-color:#b6ecf7; }
.cx-sev.info{     background:#eceef1; color:#4b5563; border-color:#dee2e6; }

/* severity */
.sev-critical{      background:#fde7e9; color:#b02a37; border-color:#f5c2c7; }
.sev-high{          background:#fff0e2; color:#a2540b; border-color:#fdd9b5; }
.sev-medium{        background:#fff6d9; color:#8a6100; border-color:#ffe69c; }
.sev-low{           background:#dff7fd; color:#0a7c92; border-color:#b6ecf7; }
.sev-informational{ background:#eceef1; color:#4b5563; border-color:#dee2e6; }
.sev-unknown{       background:#eceef1; color:#4b5563; border-color:#dee2e6; }

/* case / job status */
.status-open{   background:#e3f6ec; color:#0f7a3d; border-color:#b7e6ca; }
.status-closed{ background:#eceef1; color:#4b5563; border-color:#dee2e6; }
.status-other{  background:#fff6d9; color:#8a6100; border-color:#ffe69c; }

.st-completed{  background:#e3f6ec; color:#0f7a3d; border-color:#b7e6ca; }
.st-failed{     background:#fde7e9; color:#b02a37; border-color:#f5c2c7; }
.st-processing{ background:#e8f1ff; color:#1b4fa8; border-color:#c9dcff; }
.st-queued{     background:#fff6d9; color:#8a6100; border-color:#ffe69c; }
.st-other{      background:#eceef1; color:#4b5563; border-color:#dee2e6; }

/* priority */
.pri-critical{ background:#fde7e9; color:#b02a37; border-color:#f5c2c7; }
.pri-high{     background:#ffe9e9; color:#a92b2b; border-color:#f8cccc; }
.pri-medium{   background:#eaf1ff; color:#1b4fa8; border-color:#c9dcff; }
.pri-low{      background:#eef1f4; color:#4b5563; border-color:#e0e5ea; }

/* risk, reusing the severity scale */
.risk-high{   background:#fde7e9; color:#b02a37; border-color:#f5c2c7; }
.risk-medium{ background:#fff6d9; color:#8a6100; border-color:#ffe69c; }
.risk-low{    background:#e3f6ec; color:#0f7a3d; border-color:#b7e6ca; }


/* ================= chips / hashes ================= */

.cx-chip{

    display:inline-block;
    padding:.28em .65em;
    border-radius:7px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.3px;
    background:#eef2f7;
    color:#42505f;
    border:1px solid #e0e6ee;

}

.artifact-evtx{   background:#e8f1ff; color:#1b4fa8; border-color:#c9dcff; }
.artifact-memory{ background:#f3ecff; color:#5b21b6; border-color:#ddcdfb; }

.cx-hash{

    font-size:.8rem;
    background:#f4f6fa;
    border:1px solid #e6ebf2;
    border-radius:6px;
    padding:2px 6px;
    color:#42505f;

}

.cx-tag{

    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    background:#eef2f7;
    color:#42505f;

}


/* ================= action buttons ================= */

.cx-act{

    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:8px;
    border:1px solid #e0e6ee;
    background:#fff;
    color:#5b6672;
    font-size:13px;
    text-decoration:none;
    cursor:pointer;
    transition:.16s;

}

.cx-act:hover{ background:#eef2f7; color:var(--ink); }

.cx-act.act-primary:hover{

    background:var(--accent);
    border-color:var(--accent);
    color:#fff;

}

.cx-act.act-danger:hover{

    background:#dc3545;
    border-color:#dc3545;
    color:#fff;

}

/* Quick links, e.g. the tool row on a case card. */

.cx-tool{

    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    font-weight:600;
    padding:5px 10px;
    border-radius:999px;
    background:#f4f6fa;
    color:#44546a;
    text-decoration:none;
    transition:.18s;

}

.cx-tool:hover{ background:var(--accent); color:#fff; }


/* ================= bars ================= */

.cx-bar{

    height:6px;
    border-radius:999px;
    background:#eef1f5;
    overflow:hidden;

}

.cx-bar-fill{

    display:block;
    height:100%;
    width:0;
    border-radius:999px;
    background:var(--bar,var(--accent));
    transition:width .9s cubic-bezier(.22,1,.36,1);

}

.cx-ranks{ display:flex; flex-direction:column; gap:14px; }

.cx-rank{

    display:block;
    text-decoration:none;
    color:inherit;
    padding:7px 9px;
    border-radius:10px;
    transition:background .16s ease;

}

.cx-rank:hover{

    background:color-mix(in srgb, var(--bar,var(--accent)) 9%, #fff);
    color:inherit;

}

.cx-rank-head{

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:6px;

}

.cx-rank-title{

    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

}

.cx-rank-title i{ color:var(--bar,var(--accent)); margin-right:3px; }


/* ================= tabs ================= */

.cx-tabs .nav-link{

    color:var(--text-secondary);
    font-weight:600;
    border:none;
    border-bottom:2px solid transparent;
    border-radius:0;

}

.cx-tabs .nav-link.active{

    color:var(--ink);
    background:transparent;
    border-bottom-color:var(--accent);

}

.cx-tabs .nav-link .badge{

    background:#e9edf3;
    color:#475569;
    font-weight:600;

}


/* ================= blank states ================= */

.cx-blank{

    text-align:center;
    padding:52px 30px;

}

.cx-blank-icon{

    width:64px;
    height:64px;
    margin:0 auto 14px;
    border-radius:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    color:var(--accent);
    background:color-mix(in srgb, var(--accent) 12%, #fff);

}

/* Compact variant used inside chart cards. */

.cx-empty{

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:160px;
    color:var(--muted);
    background:var(--plane);
    border-radius:12px;
    text-align:center;
    padding:24px;

}

.cx-empty i{ font-size:26px; }


/* ================= definition grid ================= */

/* Label-over-value facts, e.g. case metadata. */

.cx-facts{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;

}

.cx-fact-label{

    font-size:11px;
    font-weight:600;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:3px;

}

.cx-fact-label i{ color:var(--accent); }

.cx-fact-value{

    font-size:14px;
    font-weight:600;
    color:var(--ink);

}


/* Older engines ignore color-mix; keep everything legible there. */

@supports not (background:color-mix(in srgb,#000 10%,#fff)){

    .cx-tile{ background:#fff; }
    .cx-head-badge{ background:#eef2f7; color:#42505f; }
    .cx-blank-icon{ background:#eef2f7; }
    .cx-rank:hover,
    .cx-table tbody tr[data-row]:hover{ background:#f6f9fe; }

}

</style>
