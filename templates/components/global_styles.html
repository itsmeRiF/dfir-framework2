{# Shared look for the all-cases views (/analysis/<tool>/).
   Same tokens the all-cases dashboard charts with, so a case
   keeps one colour and one shape everywhere. #}

<style>

/* ---------- tokens ---------- */

.viz-root{

    --surface-1:#ffffff;
    --plane:#f7f8fa;

    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:#898781;

    --grid:#e1e0d9;
    --border:rgba(11,11,11,.10);

    /* categorical slots */
    --slot-1:#2a78d6;
    --slot-2:#eb6834;
    --slot-3:#1baf7a;

    /* reserved status step */
    --crit:#d03b3b;

}


/* ---------- stat tiles ---------- */

.cx-tile{

    position:relative;
    height:100%;
    padding:16px 18px;
    border-radius:14px;
    background:var(--surface-1);
    border:1px solid var(--border);
    overflow:hidden;

}

.cx-tile::after{

    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:var(--slot-1);

}

.cx-tile.slot-2::after{ background:var(--slot-2); }
.cx-tile.slot-3::after{ background:var(--slot-3); }
.cx-tile.crit::after{ background:var(--crit); }

/* A tile that filters the page when clicked. */
.cx-tile.cx-tile-link{

    display:block;
    text-decoration:none;
    transition:.18s;

}

.cx-tile.cx-tile-link:hover{

    border-color:rgba(11,11,11,.25);
    transform:translateY(-1px);

}

.cx-tile.cx-tile-link.on{

    border-color:var(--text-primary);
    box-shadow:0 0 0 1px var(--text-primary) inset;

}

.cx-tile-icon{

    font-size:16px;
    color:var(--text-muted);
    margin-bottom:6px;

}

.cx-tile-value{

    font-size:26px;
    font-weight:700;
    line-height:1.1;
    color:var(--text-primary);
    white-space:nowrap;

}

.cx-tile-label{

    font-size:12px;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--text-secondary);

}


/* ---------- cards ---------- */

.cx-card{

    background:var(--surface-1);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 20px 20px;

}

.cx-card-head{

    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;

}

.cx-card-head h6{

    margin:0;
    font-weight:700;
    color:var(--text-primary);

}

.cx-card-head small{

    color:var(--text-muted);

}

.cx-canvas{

    position:relative;

}

.cx-empty{

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:180px;
    color:var(--text-muted);
    background:var(--plane);
    border-radius:12px;
    text-align:center;
    padding:24px;

}

.cx-empty i{

    font-size:26px;

}


/* ---------- case chip ---------- */

.cx-swatch{

    width:10px;
    height:10px;
    border-radius:3px;
    flex:none;
    display:inline-block;

}

.cx-case{

    color:inherit;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:8px;

}

.cx-case:hover .fw-semibold{

    color:#0d6efd;

}


/* ---------- tables ---------- */

.cx-table th{

    font-size:12px;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--text-muted);
    font-weight:600;
    white-space:nowrap;

}

.cx-table td{

    vertical-align:middle;

}

.cx-table td.num{

    font-variant-numeric:tabular-nums;

}

.cx-table code{

    font-size:.85rem;

}

.cx-table .badge{

    padding:.5em .8em;

}

.cx-table form{

    display:inline;
    margin:0;

}

.cx-table tfoot td{

    border-top:2px solid var(--grid);

}

/* Long free text stays on one line rather than pushing the
   table sideways; the full value is in the title attribute. */
.cx-clip{

    display:block;
    max-width:420px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

}

.cx-scroll{

    max-height:620px;
    overflow:auto;

}


/* ---------- severity ---------- */

.cx-sev{

    font-size:11px;
    font-weight:700;
    letter-spacing:.3px;
    text-transform:uppercase;
    padding:.35em .7em;
    border-radius:6px;
    white-space:nowrap;

}

.cx-sev.critical{ background:#fde2e2; color:#b02121; }
.cx-sev.high{     background:#fdeadd; color:#a4471b; }
.cx-sev.medium{   background:#fdf1d6; color:#8a6100; }
.cx-sev.low{      background:#e2f2ff; color:#1c5a99; }
.cx-sev.info{     background:#ececeb; color:#52514e; }


/* ---------- tabs ---------- */

.cx-tabs .nav-link{

    color:var(--text-secondary);
    font-weight:600;
    border:none;
    border-bottom:2px solid transparent;
    border-radius:0;

}

.cx-tabs .nav-link.active{

    color:var(--text-primary);
    background:transparent;
    border-bottom-color:var(--slot-1);

}

.cx-tabs .nav-link .badge{

    background:#e9edf3;
    color:#475569;
    font-weight:600;

}

</style>
