<div class="col-lg-3 col-md-6 mb-4">

    <div class="cx-card h-100 p-4">

        <div class="d-flex justify-content-between align-items-start">

            <div>

                <div class="text-muted mb-2">

                    {{ title }}

                </div>

                <h2 class="fw-bold mb-0 {{ value_class|default('') }}">

                    {{ value }}

                </h2>

            </div>

            <div>

                <i class="bi {{ icon }} fs-2 {{ icon_class|default('text-primary') }}"></i>

            </div>

        </div>

        {% if button_url %}

        <a href="{{ button_url }}"
           class="btn btn-outline-primary btn-sm mt-4">

            {{ button_text|default("Open") }}

        </a>

        {% endif %}

    </div>

</div>
